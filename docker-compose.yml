version: '3.8'

services:
  filamentprofiles:
    build: .
    restart: unless-stopped
    ports:
      - "7920:8000"
    environment:
      - DATABASE_URL=postgresql://filamentprofiles:changeme@db:5432/filamentprofiles
      - SPOOLMAN_URL=${SPOOLMAN_URL:-}
      - TZ=${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=filamentprofiles
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=filamentprofiles
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filamentprofiles"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
